<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascend</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon.png">
<meta name="theme-color" content="#f5f8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascend">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#10201a;--mut:#6c7a72;--line:#e6ece7;--mint:#3ddc92;--mintT:#0b8f56;--deep:#0f3d2e;--ember:#ff7f47;--sun:#ffc44d;--coral:#ff5f57;--sky:#4fa8ff;--r:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 0}
main{padding:0 16px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.03em;font-weight:800}
.sub{font-size:13px;color:var(--mut)}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.card h2{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.card h2 .s,.card h2>span{color:var(--mut);font-weight:500;font-size:13px;margin-left:8px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em}
.row{display:flex;align-items:center;gap:10px}
.sbtw{justify-content:space-between}
/* ring */
.ring{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.ring .side{text-align:center;min-width:74px}
.ring .side b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ring .side span{font-size:11.5px;color:var(--mut)}
/* stat trio */
.trio{display:flex;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.trio div{flex:1;text-align:center;border-left:1px solid var(--line)}
.trio div:first-child{border-left:0;text-align:left}
.trio b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.trio span{font-size:11.5px;color:var(--mut)}
/* session card */
.sess{background:var(--card);border-radius:var(--r);margin:14px 0;overflow:hidden;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.hd{display:none}
.hd.ef{background:linear-gradient(135deg,#7ef0bb,#22b877)}
.hd.sl{background:linear-gradient(135deg,#ffd27a,#ff9540)}
.hd.desc{background:linear-gradient(135deg,#9fd0ff,#3f86e0)}
.hd.cf{background:linear-gradient(135deg,#cfd8d3,#94a49c)}
.hd .k{font-size:11.5px;font-weight:700;color:rgba(8,26,18,.6);letter-spacing:.04em;text-transform:uppercase}
.hd .t{font-size:24px;font-weight:800;letter-spacing:-.035em;color:#07180f;line-height:1.05;margin-top:2px}
.hd .code{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:#07180f}
.body{padding:16px 18px 18px}
.mini{font-size:12.5px;color:var(--mut);line-height:1.4}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e8f7ef;color:var(--mintT)}
.pill.grey{background:#eef1ee;color:var(--mut)}
.pill.warn{background:#fff2d6;color:#8a5a0a}
/* steps */
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.steps li:first-child{border-top:0}
.steps .d{font-weight:800;color:var(--ember);font-variant-numeric:tabular-nums}
.steps .n{font-size:14.5px}
.steps .hr{display:block;font-size:12px;color:var(--mut);margin-top:2px}
/* buttons */
.btn{border:0;font:inherit;font-size:15px;font-weight:700;padding:14px 18px;border-radius:16px;background:#eef1ee;color:var(--ink);cursor:pointer}
.btn.dark{background:var(--accent);color:var(--accentInk)}
.btn.full{width:100%}
.btn.ghost{background:#fff;border:1px solid var(--line)}
/* settings */
.mod{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.mod .ic{width:56px;height:56px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.mod h3{margin:0 0 2px;font-size:16px;font-weight:700}
.line{background:var(--card);border-radius:18px;padding:16px 18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(16,32,26,.04)}
.line .v{color:var(--mut);font-weight:600}
.line .v::after{content:' ›';color:#b6c1ba}
.acct-line{background:var(--card);border-radius:18px;padding:14px 18px;margin:10px 0;box-shadow:0 1px 2px rgba(16,32,26,.04)}
.acct-lab{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.acct-val{font-size:15px;font-weight:600;margin-top:3px;word-break:break-all}
/* tabs */
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-radius:24px;display:flex;padding:8px;box-shadow:0 12px 32px rgba(16,32,26,.14)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:18px}
nav button.on{color:var(--mintT);background:#eafaf1}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lab{font-size:12px;color:var(--mut);margin:18px 0 2px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.scale b{background:#eef1ee;border-radius:9px;text-align:center;padding:9px 0;font-size:13px;font-weight:600}
.scale b.on{background:#e7f3ec;color:var(--mintT);box-shadow:inset 0 0 0 1.5px var(--mintT)}


:root{--bg:#f6f7f4;--card:#fff;--ink:#0f1c16;--mut:#6c7a72;--line:#eef2ee;--mint:#25c37e;--mintT:#0b8f56;--accent:#ecd08f;--accentInk:#4a3610;--deep:#10251c;--ember:#ff7a3d;--sun:#f5a623;--coral:#f0544c;--sky:#3f8fe0;--violet:#8b6cf0;--r:24px}
.halo{position:fixed;inset:0 0 auto;height:300px;overflow:hidden;pointer-events:none;z-index:0}
.halo i{position:absolute;display:block;border-radius:50%;filter:blur(52px);opacity:.5}
.halo .a{width:260px;height:200px;background:#b9f5d6;left:-50px;top:-70px}
.halo .b{width:230px;height:180px;background:#ffe0b8;right:-60px;top:-40px}
.halo .c{width:200px;height:160px;background:#d8d4ff;left:110px;top:40px;opacity:.35}
header,main{position:relative;z-index:1}
header{padding:calc(10px + env(safe-area-inset-top)) 20px 2px}
h1{font-size:30px;margin:0;letter-spacing:-.035em;font-weight:800;line-height:1.05}
.sub{font-size:13.5px;color:var(--mut);margin-top:4px}
svg.mi{width:24px;height:24px;fill:currentColor;stroke:none;flex:none}
.pw-eye{background:none;border:none;padding:0 10px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.pw-eye svg.mi{width:20px;height:20px}
.ic{width:52px;height:52px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center}
.ic svg.mi{width:26px;height:26px}
.ic.ef{background:#dcf7e8;color:#0b8f56}
.ic.sl,.ic.test{background:#ffeedd;color:#d1601a}
.ic.desc{background:#e0edfd;color:#2c6fb8}
.ic.cf,.ic.autre{background:#ece7fe;color:#6a4fd0}
.ic.nut{background:#ffe4ef;color:#c4487f}
.ic.inj{background:#ffe6e2;color:#cf4a3e}
.sc{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(15,28,22,.04),0 12px 30px rgba(15,28,22,.05);cursor:pointer}
.sc.today{box-shadow:0 0 0 2px #dcf7e8,0 12px 30px rgba(15,28,22,.06)}
.sc.done{opacity:1}
.sc.off{opacity:.55}
.sc .top{display:flex;gap:14px;align-items:flex-start}
.sc .ttl{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sc .when{font-size:12.5px;color:var(--mut);margin-top:2px}
.facts{display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.facts div{flex:1;border-left:1px solid var(--line);padding-left:12px;min-width:0}
.facts div:first-child{border-left:0;padding-left:0}
.facts b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts span{font-size:11.5px;color:var(--mut)}
.code{font-size:11px;font-weight:700;color:var(--mut);background:#f2f5f2;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:#e4f6ec;color:var(--mintT);white-space:nowrap}
.pill.warn{background:#fff1d9;color:#9a6207}
.pill.grey{background:#f0f2f0;color:var(--mut)}
.pill.red{background:#fde9e7;color:#c33a32}
.vd{display:flex;gap:14px;align-items:flex-start}
.vd .vdot{width:11px;height:11px;border-radius:50%;margin-top:7px;flex:none}
.vd .t{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.vd .x{font-size:13.5px;color:var(--mut);margin-top:5px;line-height:1.4}
.wknav{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 0}
.wknav button{width:38px;height:38px;border-radius:13px;border:0;background:#fff;font-size:19px;color:var(--ink);box-shadow:0 1px 3px rgba(15,28,22,.07)}
.wknav .mid{text-align:center}
.wknav .mid b{font-size:15px;font-weight:800}
.wknav .mid div{font-size:12px;color:var(--mut)}
nav svg.mi{width:22px;height:22px}


.daynav{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 0}
.daynav button{width:38px;height:38px;border-radius:13px;border:0;background:#fff;font-size:19px;color:var(--ink);box-shadow:0 1px 3px rgba(15,28,22,.07);cursor:pointer}
.daynav .mid{text-align:center}
.daynav .mid b{font-size:16px;font-weight:800}
.daynav .mid div{font-size:12px;color:var(--mut)}
.seg{display:flex;background:#f1f4f1;border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--mut);padding:10px 0;border-radius:11px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,28,22,.1)}
.q{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .lbl{flex:1;font-size:14.5px;font-weight:600;margin:0;display:block}
.q .lbl small{display:block;font-size:11.5px;color:var(--mut);font-weight:500}
.q .opts{display:flex;gap:5px}
.q .opts button{width:34px;height:34px;border:0;border-radius:11px;background:#f1f4f1;font:inherit;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
.q .opts button.on{background:#e7f3ec;color:var(--mintT);box-shadow:inset 0 0 0 1.5px var(--mintT)}
.scale button{border:0;border-radius:10px;background:#f1f4f1;font:inherit;font-size:13px;font-weight:700;padding:11px 0;color:var(--mut);cursor:pointer}
.scale button.on{background:#e7f3ec;color:var(--mintT);box-shadow:inset 0 0 0 1.5px var(--mintT)}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;align-items:end}
input.n{width:100%;border:0;background:#f1f4f1;border-radius:14px;padding:12px 10px;font:inherit;font-size:16px;text-align:center}
span.f{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
.empty{font-size:14px;color:var(--mut)}

/* ---- app-specific ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:44px;height:46px;border:0;border-radius:13px;background:#eef1ee;color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:0 8px}
.chip.on{background:#e7f3ec;color:var(--mintT);box-shadow:inset 0 0 0 1.5px var(--mintT);font-weight:700}
.chips.txt .chip{flex:0 1 auto;padding:0 14px;font-size:14px}
.chips.row4{flex-wrap:nowrap}.chips.row4 .chip{flex:1 1 0;min-width:0;padding:0 4px;font-size:13.5px;white-space:nowrap}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale .chip{min-width:0;font-size:14px;border-radius:11px;padding:0;height:44px}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:0;border-radius:14px;background:#f1f4f1;color:var(--ink)}
input[type=file]{padding:9px;font-size:13px}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.duo{display:flex;align-items:center;background:#f1f4f1;border-radius:14px;padding:0 12px}
.duo input{background:none;padding:13px 0;text-align:center;flex:1;min-width:0}
.duo span{color:var(--mut);font-weight:700;padding:0 2px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;font-weight:700;margin:16px 0 8px}
.lbl small{color:var(--mut);font-size:12px;font-weight:500}
.sheet{position:fixed;inset:0;background:rgba(8,20,14,.45);display:flex;align-items:flex-end;z-index:30}
.sheet .in{background:var(--bg);width:100%;max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.sheet .pad{padding:18px 16px 0}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;border-top:0;padding-top:0}
td:first-child,th:first-child{text-align:left}
tr.cur td{font-weight:800}tr.fut td{color:#aab5ae}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:15px;min-width:0;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,32,26,.04)}
.tile .v{font-size:26px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.tile .v small{font-size:13px;font-weight:700;color:var(--mut)}
.tile .l{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.3}
.tile .d{font-size:12px;font-weight:800;margin-top:6px}
.tile .spark{position:absolute;right:8px;top:8px;width:62px;height:24px}
.up{color:var(--mintT)}.dn{color:#cf2f28}.flat{color:var(--mut)}
.empty{font-size:14px;color:var(--mut);padding:6px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
details{margin-top:12px}
details summary{cursor:pointer;font-size:13px;color:var(--mut);font-weight:700;list-style:none;display:flex;align-items:center;gap:7px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'';width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
details>*:not(summary){margin-top:10px}
.sessrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.sessrow:first-child{border-top:0;padding-top:2px}
.sessrow .m{font-size:12px;color:var(--mut);margin-top:3px}
.sessrow .r{text-align:right;font-variant-numeric:tabular-nums}
.sessrow .r b{font-size:19px;font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef1ee;color:var(--mut);margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.ok{background:#e8f7ef;color:var(--mintT)}.tag.w{background:#fff2d6;color:#8a5a0a}.tag.b{background:#ffe6e2;color:#cf2f28}
.hero{border-radius:var(--r);padding:20px;margin:14px 0;color:#07180f}
.hero.v0{background:linear-gradient(135deg,#7ef0bb,#22b877)}
.hero.v1{background:linear-gradient(135deg,#ffd88f,#ff9f45)}
.hero.v2{background:linear-gradient(135deg,#ffa89f,#ff5f57)}
.hero .k{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.65}
.hero .t{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:3px 0 6px;line-height:1.05}
.hero ul{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.4}
.hero .foot{font-size:13px;margin-top:10px;font-weight:700;opacity:.8}
.ac{position:relative;flex:1;min-width:0}
.ac-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(16,32,26,.16);max-height:220px;overflow:auto;z-index:8}
.ac-menu div{padding:12px 15px;font-size:15px;cursor:pointer}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.steps li:first-child{border-top:0}
.steps .d{font-weight:800;color:var(--ember);font-variant-numeric:tabular-nums;font-size:14px}
.steps .n{font-size:14.5px}
.steps .hr{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.chart{margin-top:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.mini b{color:var(--ink)}
.btn.s{font-size:13.5px;padding:11px 14px;border-radius:14px}
.btn.d{color:#cf2f28;background:#fff}
.btn.x{background:none;font-size:24px;padding:0 10px;color:var(--mut);line-height:1}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mintT);outline-offset:2px}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(#f6f7f4 0%,#f6f7f4 43%,#1b5443 43%,#022d23 100%);transition:opacity .45s ease}
#splash.off{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center}
.sp-mtn{width:270px;display:block;filter:drop-shadow(0 10px 26px rgba(0,0,0,.35))}
.sp-txt{margin-top:26px;width:220px;display:block;opacity:0;animation:sptxt 1.1s ease .5s forwards}
@keyframes sptxt{to{opacity:1}}
@keyframes sprise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash,.sp-in{transition:none;animation:none}}
.brand{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mintT);margin-bottom:10px}
.brand span{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--mut);margin-top:2px}
@media (prefers-reduced-motion:reduce){.toast,details summary::before{transition:none}}
</style>

function heelBaseline(date){

  if(vals.length<5)return null;

  return vals.length%2?vals[m]:(vals[m-1]+vals[m])/2;
}
function heelHistoryN(date){

}

function weekStats(mon){

  const dayLoads=days.map(d=>sum(S.sessions.filter(s=>s.date===d).map(load)));
  const tot=sum(dayLoads),mean=tot/7,sd=Math.sqrt(sum(dayLoads.map(v=>(v-mean)*(v-mean)))/7);
  const monotony=tot>0?(sd>0?mean/sd:9.9):0;

  const heel=days.map(heelDay).filter(Boolean);

  const slp=days.filter(d=>!isOff(d)).map(d=>S.daily[d]&&S.daily[d].sleepH).filter(v=>v!=null);
  const offDays=days.filter(isOff),sickDays=days.filter(d=>dayStatus(d)==='sick').length;

    avgPain:heel.length?avg(heel.map(x=>x.pain)):null,limpDays:heel.filter(x=>x.limp).length,
    worseDays:heel.filter(x=>x.dev!=null&&x.dev>=2).length,muchWorseDays:heel.filter(x=>x.dev!=null&&x.dev>=4).length,
    baseKnown:heel.some(x=>x.base!=null),

}
function verdict(mon){
  const w=weekStats(mon),p=weekStats(addDays(mon,-7));
  const R=[];let L=0;const up=l=>{L=Math.max(L,l);};
  if(w.offDays>=2){
    const lbl=w.sickDays>=w.offDays/2?'Maladie':'Indisponibilité';
    return {level:1,interrupted:true,reasons:[lbl+' sur '+w.offDays+' jours : semaine neutralisée, ni progression ni décharge.','Ces jours sont exclus de tes références, ils ne fausseront pas la douleur, la FC repos ni le sommeil.','À la reprise, on repart au volume de la dernière semaine complète, à environ 50 % le premier jour.'],target:p.load,w,p,delta:null};
  }
  if(w.limpDays>0){up(2);R.push('Boiterie signalée au moins un matin : stop course 3 à 5 jours, protocole mollets seul, puis reprise en marche/course.');}
  else if(w.muchWorseDays>0){up(2);R.push('Douleur nettement au-dessus de ta référence au moins un matin (+4 points ou plus) : semaine de décharge à −30 %, aucune descente.');}
  else if(w.worseDays>=2){up(2);R.push('Douleur au-dessus de ta référence '+w.worseDays+' matins sur 7 : semaine de décharge à −30 %, aucune descente.');}
  else if(w.worseDays===1){up(1);R.push('Douleur au-dessus de ta référence un matin : charge maintenue, on observe 48 h avant toute progression.');}
  const delta=p.load>0?(w.load-p.load)/p.load*100:null;
  if(delta!=null&&delta>20){up(1);R.push('Charge +'+r0(delta)+' % par rapport à la semaine précédente, au-delà des +10 % : on stabilise.');}
  if(w.load>0&&w.monotony>2){up(1);R.push('Monotonie '+r1(w.monotony)+' (seuil 2) : alterner dur et facile, garder un vrai jour de repos.');}
  if(w.viol>0){up(1);R.push(w.viol+' séance(s) réellement au-dessus de la zone, en moyenne ou en temps cumulé. C\'est l\'erreur historique : ralentir, marcher les bosses.');}
  if(w.sleepN>=4&&w.sleepMean<7){up(1);R.push('Sommeil moyen '+fmtHM(w.sleepMean)+' sur '+w.sleepN+' nuits ('+w.shortNights+' sous 7 h) : sous 7 h le risque de blessure augmente nettement, pas de progression.');}
  if(w.wellMean!=null&&w.checkins>=3){
    if(w.wellMean<2.5){up(2);R.push('Forme '+r1(w.wellMean)+'/5 : récupération insuffisante, la séance suivante ne sera pas assimilée.');}
    else if(w.wellMean<3.2){up(1);R.push('Forme '+r1(w.wellMean)+'/5 : fatigue qui s\'installe, pas de progression cette semaine.');}
  }
  if(L===0&&w.load>0)R.unshift('Douleur stable par rapport à ta référence, zones respectées, forme correcte : +10 % de charge ou +15 min sur la sortie longue, pas les deux.');
  if(w.checkins<4)R.push(w.checkins+' check-in matin sur 7 : le talon n\'est pas suivi, verdict peu fiable.');
  else if(!w.baseKnown)R.push('Référence douleur en cours de calcul (moins de 5 matins d\'historique) : les écarts ne sont pas encore fiables.');
  if(w.missing)R.push(w.missing+' séance(s) sans RPE : la charge est sous-estimée.');
  if(w.load===0&&!w.offDays)R.push('Aucune séance enregistrée cette semaine.');
  else if(w.offDays)R.push(w.offDays+' jour(s) hors entraînement, exclus des références.');
  return {level:L,reasons:R,target:L===0?w.load*1.1:(L===1?w.load:w.load*0.7),w,p,delta};
}

function parseTrack(text){

  const num=el=>el?parseFloat(el.textContent):NaN,pts=[];
  const tps=doc.getElementsByTagName('Trackpoint');
  if(tps.length){
    for(let i=0;i<tps.length;i++){const tp=tps[i];const t=tp.getElementsByTagName('Time')[0];if(!t)continue;
      const hrEl=tp.getElementsByTagName('HeartRateBpm')[0];
      pts.push({t:Date.parse(t.textContent)/1000,d:num(tp.getElementsByTagName('DistanceMeters')[0]),a:num(tp.getElementsByTagName('AltitudeMeters')[0]),hr:hrEl?num(hrEl.getElementsByTagName('Value')[0]):NaN});}
  }else{
    const tk=doc.getElementsByTagName('trkpt');let dist=0,prev=null;
    for(let i=0;i<tk.length;i++){const p=tk[i];const t=p.getElementsByTagName('time')[0];if(!t)continue;
      const lat=parseFloat(p.getAttribute('lat')),lon=parseFloat(p.getAttribute('lon'));
      if(prev){const R=6371000,dLat=(lat-prev.lat)*Math.PI/180,dLon=(lon-prev.lon)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(prev.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;dist+=2*R*Math.asin(Math.sqrt(a));}
      prev={lat,lon};
      let hr=NaN;const hrEls=p.getElementsByTagNameNS('*','hr');if(hrEls.length)hr=parseFloat(hrEls[0].textContent);
      pts.push({t:Date.parse(t.textContent)/1000,d:dist,a:num(p.getElementsByTagName('ele')[0]),hr});}
  }
  return pts.filter(p=>!isNaN(p.t));
}
function trackMetrics(pts){

    const hr=pts[i].hr,da=(!isNaN(sm[i])&&!isNaN(sm[i-1]))?sm[i]-sm[i-1]:0,dd=(!isNaN(pts[i].d)&&!isNaN(pts[i-1].d))?Math.max(0,pts[i].d-pts[i-1].d):0;
    if(!isNaN(hr)){z[hr<P.efLow?0:hr<=P.efHigh?1:hr<=P.ceiling?2:3]+=dt;hrSum+=hr*dt;hrN+=dt;if(hr>hrMax)hrMax=hr;}

function blockRecap(bi){
  const today=todayISO(),b=bi.b,m0=bi.m0,end=addDays(m0,b.weeks*7);
  const mons=[];for(let i=0;i<b.weeks;i++)mons.push(addDays(m0,i*7));
  const ws=mons.map(weekStats),doneW=ws.filter(w=>w.mon<monday(today));
  const cur=Math.min(b.weeks,Math.max(1,Math.floor((parseISO(monday(today))-parseISO(m0))/6048e5)+1));
  const runs=S.sessions.filter(s=>isRun(s)&&s.date>=m0&&s.date<end).sort(byDate);
  const ref=refWeight(m0);
  const iaS=runs.filter(s=>['ef','long','test'].includes(s.type)&&ia(s)!=null);
  const iaFirst=avg(iaS.slice(0,2).map(s=>iaAdj(s,ref))),iaLast=iaS.length>=4?avg(iaS.slice(-2).map(s=>iaAdj(s,ref))):null;
  const pw=ws.filter(w=>w.avgPain!=null);
  const pFirst=avg(pw.slice(0,2).map(w=>w.avgPain)),pLast=pw.length>=3?avg(pw.slice(-2).map(w=>w.avgPain)):null;
  const longs=runs.filter(s=>s.type==='long'||s.type==='test');
  const lFirst=longs.length?longs[0].dur:null,lBest=longs.length?Math.max(...longs.map(s=>s.dur||0)):null;
  const pl=S.plan.filter(x=>x.date>=m0&&x.date<end&&x.date<today&&planStatus(x).k!=='off');
  const adh=pl.length?pl.filter(x=>planStatus(x).k==='done').length/pl.length*100:null;
  const lost=mons.flatMap((m,i)=>[0,1,2,3,4,5,6].map(j=>addDays(m,j))).filter(d=>d<today&&isOff(d)).length;
  const lvl=doneW.filter(w=>w.load>0).map(w=>verdict(w.mon).level);
  const green=lvl.filter(x=>x===0).length,red=lvl.filter(x=>x===2).length;
  const totMin=sum(runs.map(s=>s.dur||0)),totDp=sum(runs.map(s=>s.dplus||0)),viol=sum(ws.map(w=>w.viol));
  let verdictTxt;
  if(!runs.length)verdictTxt='Bloc pas encore commencé côté course.';
  else{const bits=[];
    if(pLast!=null)bits.push(pLast<pFirst-0.5?'douleur en baisse ('+r1(pFirst)+' → '+r1(pLast)+')':pLast>pFirst+0.5?'douleur en hausse ('+r1(pFirst)+' → '+r1(pLast)+')':'douleur stable');
    if(iaLast!=null)bits.push(iaLast>iaFirst*1.02?'indice aérobie en progrès':iaLast<iaFirst*0.98?'indice aérobie en retrait':'indice aérobie stable');
    if(lBest&&lFirst)bits.push('sortie longue '+lFirst+' → '+lBest+' min');
    verdictTxt=bits.length?bits.join(', ')+'.':'Pas encore assez de séances pour conclure.';
    if(lost>=3)verdictTxt+=' '+lost+' jours perdus, à prendre en compte dans la lecture.';}
  return '<div class="card" style="box-shadow:inset 0 0 0 2px var(--mint),var(--cardShadow)"><h2>Bilan du bloc<span>'+esc(b.name)+' · S'+cur+'/'+b.weeks+'</span></h2>'
   +'<div class="mini" style="font-size:14px;color:var(--ink);margin-bottom:10px">'+verdictTxt+'</div>'
   +'<div class="tiles">'
   +tile(pLast!=null?r1(pLast):(pFirst!=null?r1(pFirst):'–'),'/10','douleur au lever',pLast!=null?delta(pLast,pFirst,{lowerIsBetter:true,vs:'vs début'}):'<div class="d flat">début de bloc</div>')
   +tile(iaLast!=null?r1(iaLast):(iaFirst!=null?r1(iaFirst):'–'),'','indice aérobie',iaLast!=null?delta(iaLast,iaFirst,{pct:true,vs:'vs début'}):'<div class="d flat">2 sorties requises</div>')
   +tile(lBest!=null?lBest:'–','min','plus longue sortie',lFirst&&lBest?delta(lBest,lFirst,{unit:' min',vs:'vs 1re'}):'')
   +tile(adh!=null?r0(adh):'–','%','séances prévues faites','<div class="d flat">'+(lost?lost+' j hors entraînement':'aucun jour perdu')+'</div>')
   +tile(r0(totMin),'min','course cumulée','<div class="d flat">'+r0(totDp)+' m D+</div>')
   +tile(green+'/'+doneW.filter(w=>w.load>0).length,'','semaines vertes','<div class="d '+(red?'dn':'flat')+'">'+(red?red+' en décharge':'aucune décharge')+'</div>')
   +'</div>'
   +'<div class="mini">'+(viol?viol+' séance(s) hors zone sur le bloc.':'Zones respectées sur tout le bloc.')+' Le bilan se lit à la fin : compare S1–S2 aux deux dernières semaines.</div></div>';
}

const TCODE={ef:'EF',long:'SL',desc:'DESC',test:'TEST',cf:'CF',autre:'AUT'};
function blockInfo(date){

}
function planCode(ps){

  const mon=monday(ps.date);

}
function planTitle(ps){return (ps.type==='desc'?'Endurance'+(ps.dur?' '+ps.dur+' min':'')+' + '+(ps.reps||6)+' × 30 s descente':(TYPES[ps.type]||TYPES.autre).l+(ps.dur?' '+ps.dur+' min':''))+(ps.dplus?' · '+ps.dplus+' D+':'');}
function realizedOf(ps){

  const same=S.sessions.filter(x=>x.date===ps.date&&!x.plannedId);

function plannedOn(date){return S.plan.filter(p=>p.date===date).sort((a,b)=>(a.type==='cf')-(b.type==='cf'));}
function planMode(){

  const heelInfo=ds=>ds.map(heelDay).filter(Boolean);const h7=heelInfo(last7),h14=heelInfo(last14);
  const limp7=h7.filter(x=>x.limp).length,muchWorse7=h7.filter(x=>x.dev!=null&&x.dev>=4).length,worse7=h7.filter(x=>x.dev!=null&&x.dev>=2).length;
  const baseReady7=h7.some(x=>x.base!=null),heelClean14=h14.length>=8&&h14.every(x=>!x.limp&&(x.dev==null||x.dev<2));

const MODE={progress:['Plan tel quel','v0'],hold:['Maintien','v1'],deload:['Décharge','v2'],stop:['Arrêt course','v2']};
function adjust(ps,mode){
  if(!isRun(ps))return {dur:mode==='stop'?null:ps.dur,dplus:ps.dplus,note:mode==='stop'?'séance légère, technique':null};
  if(mode==='stop')return {dur:0,dplus:0,note:'remplacée par marche ou vélo'};
  if(mode==='deload')return {dur:Math.round((ps.dur||0)*0.7/5)*5,dplus:ps.dplus?Math.round(ps.dplus*0.7/10)*10:null,note:ps.type==='desc'?'descentes supprimées cette semaine':'−30 %'};
  if(mode==='hold'){const prev=S.plan.find(x=>x.type===ps.type&&x.date>=addDays(ps.date,-7)&&x.date<ps.date);
    if(prev&&(prev.dur||0)<(ps.dur||0))return {dur:prev.dur,dplus:prev.dplus||null,note:'on répète la semaine précédente'};}
  return {dur:ps.dur,dplus:ps.dplus,note:null};
}
function recalibrate(){
  const today=todayISO(),mon0=monday(today);
  const d14=[],d7=[];for(let i=1;i<=14;i++){const d=addDays(today,-i);d14.push(d);if(i<=7)d7.push(d);}
  const runsIn=ds=>S.sessions.filter(s=>isRun(s)&&ds.includes(s.date));
  const r7=runsIn(d7),r14=runsIn(d14);
  const off7=d7.filter(isOff).length,sick7=d7.filter(d=>dayStatus(d)==='sick').length;
  const lastLong=S.sessions.filter(s=>isRun(s)&&(s.dur||0)>=45).sort(byDate).slice(-1)[0];
  const daysSince=lastLong?Math.round((parseISO(today)-parseISO(lastLong.date))/864e5):null;
  const upcoming=S.plan.filter(p=>p.date>=today&&p.date<addDays(today,7)&&isRun(p)&&planStatus(p).k!=='done').sort(byDate);
  if(!upcoming.length)return {none:true,reasons:['Aucune séance de course prévue dans les 7 prochains jours.']};
  const minRun=sum(r7.map(s=>s.dur||0));
  let cap=null,why=[],label='';
  if(off7>=2||minRun===0){
    const ref=lastLong?lastLong.dur:40;
    cap=Math.max(20,Math.round(ref*(sick7>=2?0.5:0.6)/5)*5);
    label=sick7>=2?'Retour de maladie':'Semaine sans course';
    why.push(sick7>=2?sick7+' jours marqués malades et aucune course depuis '+(daysSince!=null?daysSince+' jours':'un moment')+'.':'Aucune course depuis '+(daysSince!=null?daysSince+' jours':'plus d\'une semaine')+'.');
    why.push('Reprise à environ '+(sick7>=2?'50':'60')+' % de ta dernière sortie ('+ref+' min), sans dénivelé, allure facile.');
    why.push('Si le talon et la FC repos restent normaux le lendemain, la séance suivante peut remonter d\'un tiers.');
  }else if(minRun<sum(runsIn(d14.slice(7)).map(s=>s.dur||0))*0.6){
    const ref=Math.max(...r7.map(s=>s.dur||0),20);
    cap=Math.round(ref*1.15/5)*5;label='Semaine allégée';
    why.push('Volume de course en net retrait sur 7 jours ('+r0(minRun)+' min).');
    why.push('On repart de ta plus longue sortie récente ('+ref+' min) plus 15 %, au lieu du plan théorique.');
  }else return {none:true,reasons:['Ton volume des 7 derniers jours est cohérent avec le plan : rien à recalibrer.','Ouvre la séance si tu veux l\'ajuster à la main.']};
  const changes=upcoming.map(p=>{const nd=Math.min(p.dur||0,cap),ndp=(nd<(p.dur||0))?0:p.dplus;
    return {id:p.id,date:p.date,type:p.type,from:p.dur,to:nd,fromDp:p.dplus,toDp:ndp,changed:nd!==p.dur||ndp!==p.dplus};}).filter(c=>c.changed);
  if(!changes.length)return {none:true,reasons:['Les séances à venir sont déjà sous le plafond de reprise.']};
  return {label,reasons:why,cap,changes};
}

function sessFacts(ps,r){
  const P=S.profile,nu=nutriFor(ps);

    return [[(ps.dur||60)+' min','durée'],['Force','orientation'],['—','WOD inconnu']];
  }
  if(r)return [[(r.dur||'–')+' min','durée'],[r.dplus?r0(r.dplus)+' m':(r.dist?r1(r.dist)+' km':'–'),r.dplus?'D+':'distance'],[r.hrAvg?'FC '+r.hrAvg:(r.rpe!=null?'RPE '+r.rpe:'–'),r.hrAvg?'moyenne':'ressenti']];

const FIT=(function(){

    const fid=[[0,1,0,5],[1,2,0x84,1],[2,2,0x84,65534],[3,4,0x8C,0x1a2b3c4d],[4,4,0x86,now]];
    const wk=[[4,1,0,1],[5,4,0x8C,32],[6,2,0x84,steps.length],[8,32,7,name]];

    let body=def(0,0,fid).concat(dat(0,fid),def(1,26,wk),dat(1,wk),def(2,27,sd));

function csv(text){
  const rows=[];let row=[],cur='',q=false;

    else{if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}}
  if(cur||row.length){row.push(cur);rows.push(row);}

  if(p.length===3)return Math.round(p[0]*60+p[1]+p[2]/60);if(p.length===2)return Math.round(p[0]+p[1]/60);return null;}

async function pull(full){
  let since=full?null:sync.lastPull, got=0, maxTs=since?Date.parse(since):0, changed=0;
  for(let page=0;page<20;page++){
    let u='/rest/v1/trail_items?select=kind,key,payload,deleted,updated_at&order=updated_at.asc&limit=500';
    if(since)u+='&updated_at=gt.'+encodeURIComponent(since);
    const rows=await sbFetch(u);
    if(!rows||!rows.length)break;
    rows.forEach(r=>{
      const k=r.kind+'|'+r.key, rt=Date.parse(r.updated_at);
      if(rt>maxTs)maxTs=rt;
      const localTs=sync.ts[k]||sync.del[k];
      if(localTs&&localTs>=rt)return;          // édition locale plus récente : elle gagne, on la poussera
      if(applyRemote(r))changed++;
    });
    got=rows.length;
    since=rows[rows.length-1].updated_at;
    if(got<500)break;
  }
  if(maxTs)sync.lastPull=new Date(maxTs).toISOString();
  return changed;
}

  });

  });
  if(!rows.length)return 0;
  for(let i=0;i<rows.length;i+=200){
    const batch=rows.slice(i,i+200);
    await sbFetch('/rest/v1/trail_items?on_conflict=user_id,kind,key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batch)});

  const txt={off:'Non connecté, données sur ce téléphone uniquement',busy:'Synchronisation…',
    ok:'À jour'+(syncAt?' · '+new Date(syncAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''),
    offline:'Hors ligne, '+n+' modification(s) en attente',auth:'Session expirée',error:syncMsg}[syncState]||'';
  const col={ok:'#2f8a5b',error:'#b8412e',offline:'#9a6207',auth:'#b8412e'}[syncState]||'';
  return '<div class="mini" id="syncline"'+(col?' style="color:'+col+'"':'')+'>'+esc(syncState==='error'?syncMsg:txt)+(syncState!=='offline'&&n?' · '+n+' en attente':'')+'</div>';
}

const SPLASH_T0=Date.now();
function hideSplash(){
  const el=$('#splash');if(!el)return;
  const wait=Math.max(0,3000-(Date.now()-SPLASH_T0));
  setTimeout(()=>{el.classList.add('off');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},500);},wait);
}

function parseHash(){const h=location.hash.startsWith('#')?location.hash.slice(1):location.hash;return new URLSearchParams(h);}

async function boot(){
  sync=Object.assign({shadow:{},ts:{},del:{},lastPull:null},lsGet(SYNC_KEY,{}));
  sync.shadow=sync.shadow||{};sync.ts=sync.ts||{};sync.del=sync.del||{};
  auth=lsGet(AUTH_KEY,null);syncAt=sync.lastSync||null;
  try{const r=await storageGet();
    if(r&&r.value){const o=JSON.parse(r.value);S={profile:Object.assign({},DEFAULT.profile,o.profile||{}),daily:o.daily||{},sessions:o.sessions||[],plan:o.plan||[]};}}
  catch(e){}
  const hp=parseHash();
  if(hp.get('type')==='recovery'&&hp.get('access_token')){
    recovery={access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token')};
    history.replaceState(null,'',location.pathname+location.search);
  }
  markChanges();
  render();
  hideSplash();
  if(recovery)return;
  if(auth){setSync('busy','');doSync(false);}
  window.addEventListener('online',()=>{if(auth)doSync(false);});
  setInterval(()=>{if(auth&&navigator.onLine&&pendingCount())doSync(false);},120000);
}

const app=window.app={
  go(v){view=v;render();window.scrollTo(0,0);},
  day(n){curDate=addDays(curDate,n);render();},
  week(n){curMon=addDays(curMon,7*n);render();},
  sweek(n){seancesMon=addDays(seancesMon,7*n);render();},
  block(i){curBlock=+i;render();},
  setSleep(part,v){const d=S.daily[curDate]||(S.daily[curDate]={}),cur=hhmm(d.sleepH);
    let hh=part==='h'?(v===''?null:Math.max(0,Math.min(14,Math.round(+v)))):cur.h;
    let mm=part==='m'?(v===''?null:Math.max(0,Math.min(59,Math.round(+v)))):cur.m;
    if((hh==null||hh===0)&&(mm==null||mm===0))delete d.sleepH;else d.sleepH=(hh||0)+(mm||0)/60;
    if(!Object.keys(d).length)delete S.daily[curDate];
    save();const c=$('#sleepmini');if(c)c.outerHTML=sleepMiniHTML(curDate);const nm=$('#numsmini');if(nm)nm.innerHTML=numsMini(curDate);},
  setDaily(k,v){const d=S.daily[curDate]||(S.daily[curDate]={});
    const str=(k==='status'||k==='note');
    if(v===''||v==null||(k==='status'&&v==='ok'))delete d[k];else d[k]=str?v:+v;
    if(!Object.keys(d).length)delete S.daily[curDate];
    save();if(k==='status'){render();return;}mark($('#view'),k,d[k]);

    if(k==='rhr'||k==='weight'){const nm=$('#numsmini');if(nm)nm.innerHTML=numsMini(curDate);}},

  planFit(id){const ps=S.plan.find(x=>x.id===id);if(!ps)return;const st=sessionSteps(ps);const bytes=planToFit({title:planCode(ps)+' '+planTitle(ps),steps:st.steps});
    const n=planCode(ps)+'.fit';if(!download(n,bytes,'application/octet-stream'))flash('Téléchargement bloqué ici');else flash(n+' : à copier dans Garmin/NewFiles');},
  planCopy(id){const ps=S.plan.find(x=>x.id===id);if(!ps)return;const t=$('#plantxt');if(!t){flash('Ouvre l\'onglet Plan');return;}t.value=planText(ps);app.copy('#plantxt');},
  openSess(id){const ps=S.plan.find(x=>x.id===id);if(!ps)return;PE=JSON.parse(JSON.stringify(ps));openPlanSheet(true);},
  toggleMod(k){const M=S.profile.modules||(S.profile.modules={});M[k]=!M[k];save();render();},
  setInjury(k,v){const I=S.profile.injury||(S.profile.injury={});I[k]=v;if(k==='type'){const b=INJURIES[v]||INJURIES.autre;I.metric=b.metric;I.avoid=b.avoid.slice();}save();render();},
  toggleAvoid(a){const I=S.profile.injury;I.avoid=I.avoid||[];const i=I.avoid.indexOf(a);if(i<0)I.avoid.push(a);else I.avoid.splice(i,1);save();render();},
  setDay(k,v){const D=S.profile.days||(S.profile.days={});D[k]=+v;save();render();},
  toggleCf(d){const D=S.profile.days||(S.profile.days={});D.cf=D.cf||[];const i=D.cf.indexOf(d);if(i<0)D.cf.push(d);else D.cf.splice(i,1);D.cf.sort();save();render();},
  setProduct(k,v){const P=S.profile.product||(S.profile.product={});P[k]=(k==='carbs'?(+v||0):v);save();render();},
  recal(){recalProposal=recalibrate();render();},
  recalClose(){recalProposal=null;render();},
  recalApply(){const R=recalProposal;if(!R||R.none)return;
    R.changes.forEach(c=>{const p=S.plan.find(x=>x.id===c.id);if(!p)return;p.dur=c.to;p.dplus=c.toDp;p.auto=false;p.note=(R.label==='Retour de maladie'?'reprise après arrêt':'recalibré')+' · plan initial '+c.from+' min';});
    recalProposal=null;save();flash(R.changes.length+' séance(s) recalibrée(s)');render();},
  addPlan(){PE={id:null,date:curDate>=todayISO()?curDate:todayISO(),type:'long',dur:60,dplus:400,note:''};openPlanSheet();},
  editPlan(id){const p=S.plan.find(x=>x.id===id);if(!p)return;PE=JSON.parse(JSON.stringify(p));openPlanSheet();},
  setPE(k,v){if(v===''||v==null)PE[k]=null;else if(['date','note','type'].includes(k))PE[k]=v;else PE[k]=+v;if(k==='type')openPlanSheet();else mark($('#sheet'),k,PE[k]);},
  savePE(){if(!PE.date){flash('Date manquante');return;}if(PE.id){const i=S.plan.findIndex(x=>x.id===PE.id);S.plan[i]=PE;}else{PE.id=uid();S.plan.push(PE);}PE.auto=false;S.plan.sort(byDate);save();app.close();render();},
  delPE(btn){if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmer';return;}S.plan=S.plan.filter(x=>x.id!==PE.id);save();app.close();render();},
  genPlan(btn){const has=S.plan.some(p=>p.date>=todayISO());if(has&&!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Remplacer les séances à venir ?';return;}
    const n=generatePlan(has);save();flash(n+' séance(s) planifiée(s)');render();},
  linkPlan(id){E.plannedId=id||null;openSheet();},
  acFilter(input,kind){const menu=input.nextElementSibling,q=input.value.trim().toLowerCase();
    if(!q){menu.hidden=true;menu.innerHTML='';return;}
    const m=acPool(kind).filter(x=>x.toLowerCase().includes(q)).slice(0,8);
    if(!m.length){menu.hidden=true;menu.innerHTML='';return;}
    menu.innerHTML=m.map(x=>'<div onmousedown="event.preventDefault();app.acPick(this)">'+esc(x)+'</div>').join('');menu.hidden=false;},
  acPick(el){const input=el.closest('.ac').querySelector('input');input.value=el.textContent;el.parentElement.hidden=true;input.blur();setTimeout(()=>input.dispatchEvent(new Event('change')),0);},
  acBlur(input){setTimeout(()=>{const m=input.nextElementSibling;if(m)m.hidden=true;},150);},
  addLift(){E.lifts=E.lifts||[];E.lifts.push({move:'',kg:null,sets:null,reps:null});openSheet();},
  setLift(i,k,v){E.lifts[i][k]=(k==='move')?v:(v===''?null:+v);if(k==='move'){const h=$('#lifthist-'+i);if(h)h.outerHTML=liftHistHTML(E.lifts[i],E.date,i);}},
  delLift(i){E.lifts.splice(i,1);openSheet();},
  addWod(){E.wod=E.wod||[];E.wod.push({reps:null,move:'',load:''});openSheet();},
  setWod(i,k,v){E.wod[i][k]=(k==='reps')?(v===''?null:+v):v;},
  delWod(i){E.wod.splice(i,1);openSheet();},
  toggleImpact(x){E.impacts=E.impacts||[];const i=E.impacts.indexOf(x);if(i<0)E.impacts.push(x);else E.impacts.splice(i,1);openSheet();},
  reset(btn){if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmer : tout effacer';return;}
    S=JSON.parse(JSON.stringify(DEFAULT));exportText=null;preview=null;save();render();}
};
Object.assign(app,{
  setAuthF(k,v){authForm[k]=v;},
  async signIn(){
    if(!authForm.email||!authForm.password){flash('Email et mot de passe requis');return;}
    try{const d=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:authForm.email.trim(),password:authForm.password})});
      setAuth(d);authForm.password='';flash('Connecté');render();doSync(true);}
    catch(e){flash(/Invalid/.test(e.message)?'Email ou mot de passe incorrect':'Connexion impossible');}
  },
  async signUp(){
    if(!authForm.email||(authForm.password||'').length<8){flash('Mot de passe de 8 caractères minimum');return;}
    try{const d=await sbFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:authForm.email.trim(),password:authForm.password})});
      if(d&&d.access_token){setAuth(d);authForm.password='';flash('Compte créé');render();doSync(true);}
      else{
        const idn=d&&(d.identities||(d.user&&d.user.identities));
        if(idn&&idn.length===0)flash('Un compte existe déjà avec cet email — connecte-toi plutôt');
        else flash('Confirme le mail reçu, puis connecte-toi');
      }}
    catch(e){flash('Création impossible : '+(e.message||'').slice(0,60));}
  },
  signOut(btn){if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmer la déconnexion';return;}
    auth=null;lsSet(AUTH_KEY,null);setSync('off','');flash('Déconnecté');render();},
  syncNow(){doSync(true);},
  resync(btn){if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmer';return;}
    sync.lastPull=null;saveSync();doSync(true,true);},
  togglePw(id,btn){const el=$('#'+id);if(!el)return;const show=el.type==='password';el.type=show?'text':'password';btn.innerHTML=mi(show?'eye_off':'eye');btn.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe');},
  async forgotPw(){
    const email=(authForm.email||'').trim();
    if(!email){flash('Indique ton email d\'abord');return;}
    try{await sbFetch('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});
      flash('Email envoyé, vérifie ta boîte de réception');}
    catch(e){flash('Envoi impossible');}
  },
  async setNewPassword(){
    const p1=$('#npw1').value,p2=$('#npw2').value;
    if(!p1||p1.length<8){flash('8 caractères minimum');return;}
    if(p1!==p2){flash('Les deux mots de passe ne correspondent pas');return;}
    try{
      await sbFetch('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+recovery.access_token},body:JSON.stringify({password:p1})});
      const u=await sbFetch('/auth/v1/user',{headers:{Authorization:'Bearer '+recovery.access_token}});
      setAuth({access_token:recovery.access_token,refresh_token:recovery.refresh_token,expires_in:3600,user:u});
      recovery=null;flash('Mot de passe mis à jour');render();doSync(true);
    }catch(e){flash('Échec : '+(e.message||'').slice(0,60));}
  },
  cancelRecovery(){recovery=null;render();}
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
boot();
})();
</script>
