<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#10201a;--mut:#5b6961;--line:#e6ece7;--mint:#3ddc92;--mintT:#087a49;--deep:#0f3d2e;--ember:#ff7f47;--sun:#ffc44d;--coral:#ff5f57;--sky:#4fa8ff;--r:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 0}
main{padding:0 16px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.03em;font-weight:800}
.sub{font-size:13px;color:var(--mut)}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.card h2{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.card h2 .s,.card h2>span{color:var(--mut);font-weight:500;font-size:13px;margin-left:8px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em}
.row{display:flex;align-items:center;gap:10px}
.sbtw{justify-content:space-between}
/* ring */
.ring{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.ring .side{text-align:center;min-width:74px}
.ring .side b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ring .side span{font-size:11.5px;color:var(--mut)}
/* stat trio */
.trio{display:flex;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.trio div{flex:1;text-align:center;border-left:1px solid var(--line)}
.trio div:first-child{border-left:0;text-align:left}
.trio b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.trio span{font-size:11.5px;color:var(--mut)}
/* session card */
.sess{background:var(--card);border-radius:var(--r);margin:14px 0;overflow:hidden;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.hd{display:none}
.hd.ef{background:linear-gradient(135deg,#7ef0bb,#22b877)}
.hd.sl{background:linear-gradient(135deg,#ffd27a,#ff9540)}
.hd.desc{background:linear-gradient(135deg,#9fd0ff,#3f86e0)}
.hd.cf{background:linear-gradient(135deg,#cfd8d3,#94a49c)}
.hd .k{font-size:11.5px;font-weight:700;color:rgba(8,26,18,.6);letter-spacing:.04em;text-transform:uppercase}
.hd .t{font-size:24px;font-weight:800;letter-spacing:-.035em;color:#07180f;line-height:1.05;margin-top:2px}
.hd .code{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:#07180f}
.body{padding:16px 18px 18px}
.mini{font-size:12.5px;color:var(--mut);line-height:1.4}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e8f7ef;color:var(--mintT)}
.pill.grey{background:#eef1ee;color:var(--mut)}
.pill.warn{background:#fff2d6;color:#8a5a0a}
/* steps */
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.steps li:first-child{border-top:0}
.steps .d{font-weight:800;color:var(--ember);font-variant-numeric:tabular-nums}
.steps .n{font-size:14.5px}
.steps .hr{display:block;font-size:12px;color:var(--mut);margin-top:2px}
/* buttons */
.btn{border:0;font:inherit;font-size:15px;font-weight:700;padding:14px 18px;border-radius:16px;background:#eef1ee;color:var(--ink);cursor:pointer}
.btn.dark{background:var(--accent);color:var(--accentInk)}
.btn.full{width:100%}
.btn.ghost{background:#fff;border:1px solid var(--line)}
/* settings */
.mod{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 2px rgba(16,32,26,.04),0 10px 28px rgba(16,32,26,.05)}
.mod .ic{width:56px;height:56px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.mod h3{margin:0 0 2px;font-size:16px;font-weight:700}
.line{background:var(--card);border-radius:18px;padding:16px 18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(16,32,26,.04)}
.line .v{color:var(--mut);font-weight:600}
.line .v::after{content:' ›';color:#b6c1ba}
.acct-line{background:var(--card);border-radius:18px;padding:14px 18px;margin:10px 0;box-shadow:0 1px 2px rgba(16,32,26,.04)}
.acct-lab{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.acct-val{font-size:15px;font-weight:600;margin-top:3px;word-break:break-all}
/* tabs */
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-radius:24px;display:flex;padding:8px;box-shadow:0 12px 32px rgba(16,32,26,.14)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:18px}
nav button.on{color:var(--mintT);background:#eafaf1}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lab{font-size:12px;color:var(--mut);margin:18px 0 2px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.scale b{background:#eef1ee;border-radius:9px;text-align:center;padding:9px 0;font-size:13px;font-weight:600}
.scale b.on{background:#e7f3ec;color:var(--mintT);box-shadow:inset 0 0 0 1.5px var(--mintT)}


:root{--coralT:#b8352d;--sunT:#8a5a0a;--acc:#087a49;--cardShadow:0 1px 2px rgba(15,28,22,.04),0 12px 30px rgba(15,28,22,.05);--s1:#fff;--s3:#c9d1cb;--bg:#f6f7f4;--card:#fff;--ink:#0f1c16;--mut:#5b6961;--line:#eef2ee;--mint:#25c37e;--mintT:#087a49;--accent:#ecd08f;--accentInk:#4a3610;--deep:#10251c;--ember:#ff7a3d;--sun:#f5a623;--coral:#f0544c;--sky:#3f8fe0;--violet:#8b6cf0;--r:24px}
.halo{position:fixed;inset:0 0 auto;height:300px;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 80px);mask-image:linear-gradient(to bottom,transparent 0,#000 80px)}
.halo i{position:absolute;display:block;border-radius:50%;filter:blur(52px);opacity:.5}
.halo .a{width:260px;height:200px;background:#b9f5d6;left:-50px;top:-70px}
.halo .b{width:230px;height:180px;background:#ffe0b8;right:-60px;top:-40px}

header{padding:calc(10px + env(safe-area-inset-top)) 20px 2px}

svg.mi{width:24px;height:24px;fill:currentColor;stroke:none;flex:none}

.wk .d.ef{background:#dcf7e8;color:#0b8f56}.wk .d.sl{background:#ffeedd;color:#d1601a}.wk .d.desc{background:#e0edfd;color:#2c6fb8}.wk .d.cf,.wk .d.autre{background:#ece7fe;color:#6a4fd0}

.objl{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}

.wrow{display:flex;align-items:center;gap:10px;padding:12px 14px}

details.stq{margin-top:12px}

.toast.long{white-space:normal;border-radius:16px;width:max-content;max-width:calc(100% - 32px);text-align:left;line-height:1.4;font-weight:600}
.toast.long b{display:block;font-weight:800}
.sc{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(15,28,22,.04),0 12px 30px rgba(15,28,22,.05);cursor:pointer}

.facts span{font-size:11.5px;color:var(--mut)}
.code{font-size:11px;font-weight:700;color:var(--mut);background:#f2f5f2;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:#e4f6ec;color:var(--mintT);white-space:nowrap}
.pill.warn{background:#fff1d9;color:#9a6207}

.wl{padding:4px 14px}

.wkh{display:flex;align-items:center;justify-content:space-between;gap:8px}.wkh>div{text-align:center;flex:1;min-width:0}.wkh h1{font-size:22px;margin:0}.wkh button{width:44px;height:44px;border-radius:14px;border:0;background:#fff;font-size:20px;color:var(--ink);box-shadow:0 1px 3px rgba(15,28,22,.07);flex:none}

function parseTrack(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  const num=el=>el?parseFloat(el.textContent):NaN,pts=[];
  const tps=doc.getElementsByTagName('Trackpoint');
  if(tps.length){
    for(let i=0;i<tps.length;i++){const tp=tps[i];const t=tp.getElementsByTagName('Time')[0];if(!t)continue;
      const hrEl=tp.getElementsByTagName('HeartRateBpm')[0];
      pts.push({t:Date.parse(t.textContent)/1000,d:num(tp.getElementsByTagName('DistanceMeters')[0]),a:num(tp.getElementsByTagName('AltitudeMeters')[0]),hr:hrEl?num(hrEl.getElementsByTagName('Value')[0]):NaN});}
  }else{
    const tk=doc.getElementsByTagName('trkpt');let dist=0,prev=null;
    for(let i=0;i<tk.length;i++){const p=tk[i];const t=p.getElementsByTagName('time')[0];if(!t)continue;
      const lat=parseFloat(p.getAttribute('lat')),lon=parseFloat(p.getAttribute('lon'));
      if(prev){const R=6371000,dLat=(lat-prev.lat)*Math.PI/180,dLon=(lon-prev.lon)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(prev.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;dist+=2*R*Math.asin(Math.sqrt(a));}
      prev={lat,lon};
      let hr=NaN;const hrEls=p.getElementsByTagNameNS('*','hr');if(hrEls.length)hr=parseFloat(hrEls[0].textContent);
      pts.push({t:Date.parse(t.textContent)/1000,d:dist,a:num(p.getElementsByTagName('ele')[0]),hr});}
  }
  return pts.filter(p=>!isNaN(p.t));
}
function trackMetrics(pts){

  const alt=pts.map(p=>p.a);const sm=alt.map((v,i)=>{const w=alt.slice(Math.max(0,i-4),i+5).filter(x=>!isNaN(x));return w.length?sum(w)/w.length:NaN;});

  const C=g=>{g=Math.max(-0.45,Math.min(0.45,g));return (155.4*g*g*g*g*g-30.4*g*g*g*g-43.3*g*g*g+46.3*g*g+19.5*g+3.6)/3.6;};

  for(let i=1;i<pts.length;i++){const dt=Math.min(pts[i].t-pts[i-1].t,30);if(dt<=0)continue;tot+=dt;
    const hr=pts[i].hr,da=(!isNaN(sm[i])&&!isNaN(sm[i-1]))?sm[i]-sm[i-1]:0,dd=(!isNaN(pts[i].d)&&!isNaN(pts[i-1].d))?Math.max(0,pts[i].d-pts[i-1].d):0;
    if(!isNaN(hr)){hrSum+=hr*dt;hrN+=dt;if(hr>hrMax)hrMax=hr;}

    if(g<-0.04){dT+=dt;dD-=da;if(!isNaN(hr)){dHR+=hr*dt;dN+=dt;}}else if(g>0.04){uT+=dt;if(!isNaN(hr)){uHR+=hr*dt;uN+=dt;}}

/* aperçu : ce que l'enregistrement change dans les 14 prochains jours */
function planDiff(pA,pB){
  const t=todayISO(),end=addDays(t,14),run=p=>{try{return ENGINE.build({profile:p,today:t,sessions:S.sessions,isRun,isOff}).sessions.filter(x=>x.date>=t&&x.date<end);}catch(e){return [];}};
  const A=run(pA),B=run(pB),key=x=>x.date+'|'+x.type,lab=x=>fmtS(x.date)+' · '+(x.title||(TYPES[x.type]||TYPES.autre).l)+' '+x.dur+' min';
  const out=[];
  B.forEach(x=>{const y=A.find(z=>key(z)===key(x));if(!y)out.push({d:x.date,t:'+ '+lab(x)});else if(y.dur!==x.dur||y.title!==x.title)out.push({d:x.date,t:'~ '+lab(y)+' → '+x.dur+' min'});});
  A.forEach(x=>{if(!B.find(z=>key(z)===key(x)))out.push({d:x.date,t:'− '+lab(x)});});
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(o=>o.t);
}

function estRef(P){const St=P.start||{},i=refRace(P);if(i>=0)return Object.assign({nom:(St.pastRaces[i].name||'').trim()},St.pastRaces[i]);
  const L=St.lastLong||{};return (!St.noLong&&L.dur&&L.dist)?Object.assign({nom:'ta plus longue sortie'},L):null;}
function estDur(dist,dplus,P){const ke=(+dist||0)+(+dplus||0)/100;if(!ke)return null;const ref=estRef(P);
  if(ref){const kr=ref.dist+(ref.dplus||0)/100,m=ref.dur*Math.pow(ke/kr,1.07),w=.05+.05*Math.abs(Math.log(ke/kr))/Math.LN2;return {m,lo:m*(1-w),hi:m*(1+w),ref};}
  const m=ke/7*60;return {m,lo:m*.75,hi:m*1.25,ref:null};}

/* ---------- encodeur FIT (séance structurée) ---------- */
const FIT=(function(){
  const T=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];

  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  function str(s,n){const b=[];const e=unescape(encodeURIComponent(s||'')).slice(0,n-1);for(let i=0;i<e.length;i++)b.push(e.charCodeAt(i));while(b.length<n)b.push(0);return b;}
  const def=(loc,g,f)=>[0x40|loc,0,0].concat(u16(g),[f.length],f.flatMap(x=>[x[0],x[1],x[2]]));
  const dat=(loc,f)=>[loc].concat(f.flatMap(x=>x[2]===7?str(x[3],x[1]):x[1]===1?[x[3]&255]:x[1]===2?u16(x[3]):u32(x[3])));
  const INV=0xFFFFFFFF;
  function build(name,steps){
    const now=Math.floor(Date.now()/1000)-631065600;
    const fid=[[0,1,0,5],[1,2,0x84,1],[2,2,0x84,65534],[3,4,0x8C,0x1a2b3c4d],[4,4,0x86,now]];
    const wk=[[4,1,0,1],[5,4,0x8C,32],[6,2,0x84,steps.length],[8,32,7,name]];
    const sd=[[254,2,0x84,0],[0,16,7,''],[1,1,0,0],[2,4,0x86,0],[3,1,0,0],[4,4,0x86,0],[5,4,0x86,0],[6,4,0x86,0],[7,1,0,0]];
    let body=def(0,0,fid).concat(dat(0,fid),def(1,26,wk),dat(1,wk),def(2,27,sd));
    steps.forEach((s,i)=>{const f=sd.map(x=>x.slice());f[0][3]=i;f[1][3]=s.name;f[2][3]=s.durType;f[3][3]=s.durVal;f[4][3]=s.tgtType;f[5][3]=s.tgtVal;f[6][3]=s.low;f[7][3]=s.high;f[8][3]=s.intensity;body=body.concat(dat(2,f));});
    const hdr=[14,0x10].concat(u16(2140),u32(body.length),[46,70,73,84]);const h=hdr.concat(u16(crc(hdr)));
    const all=h.concat(body);return new Uint8Array(all.concat(u16(crc(all))));
  }
  return {build,INV};
})();
function planToFit(p){ /* p: {title,steps} */
  const P=S.profile,st=[];
  const hr=(lo,hi)=>(lo||hi)?{tgtType:1,tgtVal:0,low:100+(lo||90),high:100+(hi||220)}:{tgtType:2,tgtVal:FIT.INV,low:FIT.INV,high:FIT.INV};
  p.steps.forEach(s=>{
    if(s.rep){const first=st.length;
      st.push(Object.assign({name:s.on.n,durType:0,durVal:s.on.sec*1000,intensity:s.on.int},hr(null,null)));
      st.push(Object.assign({name:s.off.n,durType:0,durVal:s.off.sec*1000,intensity:s.off.int},hr(null,null)));
      st.push({name:'Repeter',durType:6,durVal:first,tgtType:2,tgtVal:s.rep,low:FIT.INV,high:FIT.INV,intensity:0});
    }else st.push(Object.assign({name:s.n,durType:0,durVal:s.min*60000,intensity:s.int},hr(s.lo,s.hi)));
  });
  return FIT.build(p.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/×/g,'x'),st);
}

/* ---------- import Garmin CSV ---------- */
function csv(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}}
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1);
}
function num(v){if(v==null)return null;v=String(v).trim().replace(/\s/g,'');if(!v||v==='--')return null;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v))v=v.replace(/,/g,'');else v=v.replace(',','.');
  const n=parseFloat(v);return isNaN(n)?null:n;}
function durMin(v){const p=String(v||'').trim().split(':').map(Number);if(!p.length||p.some(isNaN))return null;
  if(p.length===3)return Math.round(p[0]*60+p[1]+p[2]/60);if(p.length===2)return Math.round(p[0]+p[1]/60);return null;}
function toISO(v){v=String(v||'');let m=v.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=v.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+'-'+m[2]+'-'+m[1];return null;}
function parseGarmin(text){
  const rows=csv(text);if(rows.length<2)return null;
  const H=rows[0].map(h=>h.trim().toLowerCase()),find=re=>H.findIndex(h=>re.test(h));
  const c={type:find(/type/),date:find(/^date/),title:find(/titre|title/),dist:find(/^distance/),dur:find(/^(dur[ée]e|time|temps)$/),hrAvg:find(/fc moy|avg hr|average hr/),hrMax:find(/fc max|max hr/),dplus:find(/gain|ascent|d\+|mont[ée]e/),dminus:find(/perte|descent|d-|descente/)};
  if(c.date<0||c.dur<0)return null;
  return rows.slice(1).map(r=>{const g=i=>i>=0?r[i]:null;const date=toISO(g(c.date)),dur=durMin(g(c.dur));if(!date||!dur)return null;
    const t=((g(c.type)||'')+' '+(g(c.title)||'')).toLowerCase();let type='autre';
    if(/trail|course|run|marche|hike|rando|walk/.test(t))type=dur>=90?'long':'ef';else if(/muscu|strength|crossfit|force|cardio|hiit|fitness|gym/.test(t))type='cf';
    const o={id:uid(),src:'garmin',date,type,dur,dist:num(g(c.dist)),dplus:num(g(c.dplus)),dminus:num(g(c.dminus)),hrAvg:num(g(c.hrAvg)),hrMax:num(g(c.hrMax)),rpe:null,legs:null,heelPost:null,shoe:'',carbs:null,fluids:null,gi:null,dip:null,note:g(c.title)||'',src:'garmin'};
    if(type==='cf'||type==='autre'){o.dist=null;o.dplus=null;o.dminus=null;}
    o.dup=S.sessions.some(s=>s.date===date&&Math.abs((s.dur||0)-dur)<=2);
    return o;}).filter(Boolean);
}

/* --- détection des changements locaux (diff contre l'ombre du dernier état synchronisé) --- */
function snapshot(){
  const m={};
  m['profile|me']=S.profile;
  (S.sessions||[]).forEach(s=>{if(s.id)m['session|'+s.id]=s;});
  Object.keys(S.daily||{}).forEach(d=>{m['daily|'+d]=S.daily[d];});

}
function splitKey(k){const i=k.indexOf('|');return {kind:k.slice(0,i),key:k.slice(i+1)};}
function markChanges(){
  const now=snapshot(),sh=sync.shadow,t=Date.now();let n=0;
  Object.keys(now).forEach(k=>{const j=JSON.stringify(now[k]);if(sh[k]!==j){sync.ts[k]=t;n++;}if(sync.del[k])delete sync.del[k];});
  Object.keys(sh).forEach(k=>{if(!(k in now)){if(!sync.del[k]){sync.del[k]=t;n++;}delete sync.ts[k];}});
  if(n)saveSync();
  return n;
}

/* --- HTTP --- */
async function sbFetch(path,opts){
  opts=opts||{};
  const h=Object.assign({'apikey':SUP_KEY,'Content-Type':'application/json'},opts.headers||{});
  if(auth&&auth.access_token)h['Authorization']='Bearer '+auth.access_token;
  const r=await fetch(SUP_URL+path,Object.assign({},opts,{headers:h}));
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}const e2=new Error(t||('HTTP '+r.status));e2.status=r.status;throw e2;}
  if(r.status===204)return null;
  const txt=await r.text();return txt?JSON.parse(txt):null;
}

/* --- application d'une ligne distante dans l'état local --- */
function applyRemote(row){
  const kind=row.kind,key=row.key,k=kind+'|'+key;
  if(row.deleted){
    if(kind==='session')S.sessions=S.sessions.filter(x=>x.id!==key);
    else if(kind==='plan')S.plan=S.plan.filter(x=>x.id!==key);
    else if(kind==='daily')delete S.daily[key];
    delete sync.shadow[k];
  }else{
    const v=row.payload;
    if(kind==='profile')S.profile=normProfile(v);
    else if(kind==='daily')S.daily[key]=v;
    else if(kind==='session'){const i=S.sessions.findIndex(x=>x.id===key);if(i<0)S.sessions.push(v);else S.sessions[i]=v;S.sessions.sort(byDate);}
    else if(kind==='plan'&&oldPlan(v)){}
    else if(kind==='plan'){const i=S.plan.findIndex(x=>x.id===key);if(i<0)S.plan.push(v);else S.plan[i]=v;S.plan.sort(byDate);}
    else return false;
    sync.shadow[k]=JSON.stringify(v);
  }
  delete sync.ts[k];delete sync.del[k];
  return true;
}

async function pull(full){
  let since=full?null:sync.lastPull, got=0, maxTs=since?Date.parse(since):0, changed=0;
  for(let page=0;page<20;page++){
    let u='/rest/v1/trail_items?select=kind,key,payload,deleted,updated_at&order=updated_at.asc&limit=500';
    if(since)u+='&updated_at=gt.'+encodeURIComponent(since);
    const rows=await sbFetch(u);
    if(!rows||!rows.length)break;
    rows.forEach(r=>{
      const k=r.kind+'|'+r.key, rt=Date.parse(r.updated_at);
      if(rt>maxTs)maxTs=rt;
      const localTs=sync.ts[k]||sync.del[k];
      if(localTs&&localTs>=rt)return;          // édition locale plus récente : elle gagne, on la poussera
      if(applyRemote(r))changed++;
    });
    got=rows.length;
    since=rows[rows.length-1].updated_at;
    if(got<500)break;
  }
  if(maxTs)sync.lastPull=new Date(maxTs).toISOString();
  return changed;
}

async function push(){
  const rows=[],snap=snapshot();
  Object.keys(sync.ts).forEach(k=>{
    const sp=splitKey(k),now=snap[k];
    if(now===undefined)return;
    rows.push({user_id:auth.user_id,kind:sp.kind,key:sp.key,payload:now,deleted:false,updated_at:new Date(sync.ts[k]).toISOString()});
  });
  Object.keys(sync.del).forEach(k=>{
    const sp=splitKey(k);
    rows.push({user_id:auth.user_id,kind:sp.kind,key:sp.key,payload:null,deleted:true,updated_at:new Date(sync.del[k]).toISOString()});
  });
  if(!rows.length)return 0;
  for(let i=0;i<rows.length;i+=200){
    const batch=rows.slice(i,i+200);
    await sbFetch('/rest/v1/trail_items?on_conflict=user_id,kind,key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batch)});
    batch.forEach(r=>{const k=r.kind+'|'+r.key;
      if(r.deleted){delete sync.shadow[k];delete sync.del[k];}
      else{if(snap[k]!==undefined)sync.shadow[k]=JSON.stringify(snap[k]);delete sync.ts[k];}});
    saveSync();
  }
  return rows.length;
}

    markChanges();

    if(!email){flash('Indique ton email d\'abord');return;}
    try{await sbFetch('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});
      flash('Email envoyé, vérifie ta boîte de réception');}
    catch(e){flash('Envoi impossible');}
  },
  async setNewPassword(){
    const p1=$('#npw1').value,p2=$('#npw2').value;
    if(!p1||p1.length<8){flash('8 caractères minimum');return;}
    if(p1!==p2){flash('Les deux mots de passe ne correspondent pas');return;}
    try{
      await sbFetch('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+recovery.access_token},body:JSON.stringify({password:p1})});
      const u=await sbFetch('/auth/v1/user',{headers:{Authorization:'Bearer '+recovery.access_token}});
      setAuth({access_token:recovery.access_token,refresh_token:recovery.refresh_token,expires_in:3600,user:u});
      recovery=null;flash('Mot de passe mis à jour');render();doSync(true);
    }catch(e){flash('Échec : '+(e.message||'').slice(0,60));}
  },
  cancelRecovery(){recovery=null;render();}
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
boot();
})();
</script>
</body>
</html>
