<title>Lancement Ascend</title>
<style>
:root{color-scheme:dark;--g:#114336;--gold:#e9c46a;--line:214,240,226;--app:#f6f7f4}
html,body{height:100%;margin:0;background:var(--g);overflow:hidden}
#st{position:fixed;inset:0;background:var(--g)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg{position:absolute;left:50%;top:236px;width:253.333px;margin-left:-126.667px;transform-origin:50% 50%;will-change:transform,opacity}
.lg img{width:100%;display:block}
.tx{position:absolute;left:50%;top:494px;width:220px;margin-left:-110px;opacity:0}
.tx img{width:100%;display:block}
#app{position:absolute;inset:0;background:var(--app);opacity:0;pointer-events:none;font:15px -apple-system,Roboto,sans-serif;color:#0f1c16;padding:24px 20px}
#app h1{margin:0;font-size:23px;letter-spacing:-.03em}#app p{margin:4px 0 0;color:#5b6961;font-size:13px}
#app .c{background:#fff;border-radius:22px;height:180px;margin-top:18px;box-shadow:0 10px 26px rgba(15,28,22,.06)}
#ctl{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:5}
#ctl button{font:700 15px -apple-system,Roboto,sans-serif;border:0;border-radius:16px;padding:12px 18px;background:#10251c;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
#ctl button.s{background:rgba(255,255,255,.9);color:#10251c}
#ctl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<div id="st">
  <canvas id="cv"></canvas>
  <div class="lg" id="lg"><img src="__LOGO__" alt="Ascend"></div>
  <div class="tx" id="tx"><img src="__TXT__" alt="Reach your peak"></div>
  <div id="app"><h1>Mercredi 5 novembre</h1><p>Semaine 1 sur 47 · Reprise</p><div class="c"></div><div class="c" style="height:120px"></div></div>
</div>
<div id="ctl"><button id="rp">Rejouer</button><button id="sl" class="s">Ralenti ×3</button></div>
<script>
(function(){
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),lg=document.getElementById('lg'),tx=document.getElementById('tx'),app=document.getElementById('app');
let W=0,H=0,DPR=1;
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',size);size();
/* relief : sommet principal, épaulements, bruit */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const G=[[0.12,0.55,1.0,0.26],[-0.38,0.42,0.7,0.2],[0.58,0.38,0.72,0.2],[-0.2,-0.1,0.35,0.3],[0.4,0.85,0.5,0.18],[-0.7,0.85,0.55,0.2],[0.75,-0.4,0.35,0.22],[-0.75,-0.3,0.3,0.2]];
const nz=[];for(let i=0;i<70;i++)nz.push([rnd()*2.4-1.2,rnd()*2.4-1.2,(rnd()-.35)*0.32,0.06+rnd()*0.11]);
function hgt(x,y){let h=0;for(const g of G){const dx=x-g[0],dy=y-g[1];h+=g[2]*Math.exp(-(dx*dx+dy*dy)/(2*g[3]*g[3]));}for(const g of nz){const dx=x-g[0],dy=y-g[1];h+=g[2]*Math.exp(-(dx*dx+dy*dy)/(2*g[3]*g[3]));}return Math.max(0,h);}
const N=96,HS=0.55,grid=new Float32Array((N+1)*(N+1));const P=i=>-1.2+2.4*i/N;
for(let j=0;j<=N;j++)for(let i=0;i<=N;i++)grid[j*(N+1)+i]=hgt(P(i),P(j));
/* courbes de niveau (marching squares) */
const segs=[];const L=[];for(let v=0.05;v<1.15;v+=0.05)L.push(v);
for(const lv of L){for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const a=grid[j*(N+1)+i],b=grid[j*(N+1)+i+1],c=grid[(j+1)*(N+1)+i+1],d=grid[(j+1)*(N+1)+i];
  const k=(a>lv)|((b>lv)<<1)|((c>lv)<<2)|((d>lv)<<3);if(k===0||k===15)continue;
  const x0=P(i),x1=P(i+1),y0=P(j),y1=P(j+1),t=(p,q)=>(lv-p)/(q-p);
  const e=[[x0+(x1-x0)*t(a,b),y0],[x1,y0+(y1-y0)*t(b,c)],[x0+(x1-x0)*t(d,c),y1],[x0,y0+(y1-y0)*t(a,d)]];
  const T={1:[[0,3]],2:[[0,1]],3:[[1,3]],4:[[1,2]],5:[[0,1],[2,3]],6:[[0,2]],7:[[2,3]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[k];
  for(const [p,q] of T)segs.push(e[p][0],e[p][1],e[q][0],e[q][1],lv*HS);}}
const S=new Float32Array(segs);
/* chemin : du bas vers le sommet, en suivant la pente avec des lacets */
const path=[];{let x=-0.35,y=-0.95;const tx_=0.12,ty_=0.55;for(let k=0;k<260;k++){const dx=tx_-x,dy=ty_-y,d=Math.hypot(dx,dy);if(d<0.015)break;
  const e=0.01,gx=(hgt(x+e,y)-hgt(x-e,y))/(2*e),gy=(hgt(x,y+e)-hgt(x,y-e))/(2*e),gl=Math.hypot(gx,gy)||1;
  const w=Math.sin(k*0.11)*0.9;let vx=dx/d*0.75+gx/gl*0.25-dy/d*w*0.6,vy=dy/d*0.75+gy/gl*0.25+dx/d*w*0.6;const vl=Math.hypot(vx,vy);
  x+=vx/vl*0.0085;y+=vy/vl*0.0085;path.push([x,y,hgt(x,y)*HS+0.006]);}path.push([tx_,ty_,hgt(tx_,ty_)*HS+0.006]);}
/* caméra */
const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t),lerp=(a,b,t)=>a+(b-a)*t,L3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const K=[[0.9,[0.05,-0.25,3.4],[0.05,0.15,0]],[2.7,[-0.35,-2.05,1.15],[0.0,0.15,0.2]],[4.9,[0.25,-1.05,0.95],[0.12,0.55,0.5]]];
function cam(t){if(t<=K[0][0])return [K[0][1],K[0][2]];for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b[0]){const u=sm((t-a[0])/(b[0]-a[0]));return [L3(a[1],b[1],u),L3(a[2],b[2],u)];}}return [K[K.length-1][1],K[K.length-1][2]];}
function proj(C,Tg){const f=[Tg[0]-C[0],Tg[1]-C[1],Tg[2]-C[2]],fl=Math.hypot(...f);f[0]/=fl;f[1]/=fl;f[2]/=fl;
  let r=[f[1],-f[0],0];const rl=Math.hypot(r[0],r[1])||1;r[0]/=rl;r[1]/=rl;const u=[r[1]*f[2]-0,-(r[0]*f[2]),r[0]*f[1]-r[1]*f[0]];
  const F=Math.min(W,H)*1.15;return (x,y,z)=>{const dx=x-C[0],dy=y-C[1],dz=z-C[2],zc=dx*f[0]+dy*f[1]+dz*f[2];if(zc<0.05)return null;
    return [W/2+F*(dx*r[0]+dy*r[1])/zc,H*0.46-F*(dx*u[0]+dy*u[1]+dz*u[2])/zc,zc];};}
const ease=(t,a,b)=>sm((t-a)/(b-a));
let t0=0,speed=1,raf=0;
function frame(now){const t=(now-t0)/1000*speed;draw(Math.min(t,6.2));if(t<6.2)raf=requestAnimationFrame(frame);}
function draw(t){
  /* logo : fixe, puis zoom et fondu (0,8 → 1,6 s) ; retour 4,8 → 5,4 s */
  const zo=ease(t,0.8,1.6),back=ease(t,4.75,5.35);
  const s=back>0?lerp(0.82,1,back):1+zo*1.6;lg.style.transform='scale('+s+')';lg.style.opacity=back>0?back:1-zo;
  tx.style.opacity=ease(t,5.0,5.5);
  /* relief */
  const ta=ease(t,0.9,1.6)*(1-ease(t,4.6,5.2));cx.clearRect(0,0,W,H);
  if(ta>0){const [C,Tg]=cam(t),pr=proj(C,Tg);cx.lineWidth=1;
    const B=[[],[],[],[]];for(let k=0;k<S.length;k+=5){const a=pr(S[k],S[k+1],S[k+4]),b=pr(S[k+2],S[k+3],S[k+4]);if(!a||!b)continue;
      if((a[0]<-50&&b[0]<-50)||(a[0]>W+50&&b[0]>W+50)||(a[1]<-50&&b[1]<-50)||(a[1]>H+50&&b[1]>H+50))continue;
      const dz=(a[2]+b[2])/2,bi=dz<1.2?0:dz<1.9?1:dz<2.8?2:3;B[bi].push(a[0],a[1],b[0],b[1]);}
    const al=[0.85,0.6,0.38,0.2];B.forEach((arr,bi)=>{cx.strokeStyle='rgba(214,240,226,'+(al[bi]*ta)+')';cx.beginPath();for(let k=0;k<arr.length;k+=4){cx.moveTo(arr[k],arr[k+1]);cx.lineTo(arr[k+2],arr[k+3]);}cx.stroke();});
    /* chemin doré qui grimpe (1,6 → 4,6 s) */
    const pg=ease(t,1.6,4.6),n=Math.max(2,Math.floor(pg*path.length));
    cx.save();cx.globalAlpha=ta;cx.strokeStyle='#e9c46a';cx.lineWidth=3.2;cx.lineJoin=cx.lineCap='round';cx.shadowColor='rgba(233,196,106,.9)';cx.shadowBlur=10;
    cx.beginPath();let st=false,last=null;for(let k=0;k<n;k++){const q=pr(...path[k]);if(!q){st=false;continue;}if(!st){cx.moveTo(q[0],q[1]);st=true;}else cx.lineTo(q[0],q[1]);last=q;}cx.stroke();
    if(last&&pg>0&&pg<1){cx.fillStyle='#fff7df';cx.beginPath();cx.arc(last[0],last[1],4.2,0,7);cx.fill();}cx.restore();}
  /* sortie vers l'appli (5,6 → 6,0 s) */
  app.style.opacity=ease(t,5.6,6.0);
}
function play(sp){cancelAnimationFrame(raf);speed=sp;t0=performance.now();raf=requestAnimationFrame(frame);}
document.getElementById('rp').onclick=()=>play(1);document.getElementById('sl').onclick=()=>play(1/3);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(5.5);else play(1);
})();
</script>
